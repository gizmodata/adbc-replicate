{{- if not (or .Values.config .Values.configFile) }}
{{- fail "values.config (or configFile) is required: the replication config (see values.yaml)" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "adbc-replicate.fullname" . }}
  labels:
    {{- include "adbc-replicate.labels" . | nindent 4 }}
data:
  {{- if .Values.configFile }}
  replicate.yaml: {{ .Values.configFile | quote }}
  {{- else }}
  replicate.yaml: |
    {{- toYaml .Values.config | nindent 4 }}
  {{- end }}
{{- if .Values.viewOverrides }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "adbc-replicate.fullname" . }}-view-overrides
  labels:
    {{- include "adbc-replicate.labels" . | nindent 4 }}
data:
  {{- range $name, $sql := .Values.viewOverrides }}
  {{ $name }}: |
    {{- $sql | nindent 4 }}
  {{- end }}
{{- end }}
